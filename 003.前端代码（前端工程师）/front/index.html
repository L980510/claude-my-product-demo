<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF7F9" />
  <title>消费记账</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录页（演示：纯前端模拟，无真实后端） -->
  <section id="auth-login" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-logo">🌸</div>
      <h1 class="auth-title">消费记账</h1>
      <p class="auth-sub">轻松记录每一天的花销</p>

      <input id="login-username" class="text-input" placeholder="用户名" autocomplete="username" />
      <input id="login-password" class="text-input" type="password" placeholder="密码" autocomplete="current-password" />
      <label class="remember"><input id="login-remember" type="checkbox" /> 记住我</label>
      <button id="login-btn" class="btn-primary">登录</button>
      <div class="auth-switch">还没有账号？<a id="to-register">去注册</a></div>
    </div>
  </section>

  <!-- 注册页（演示：纯前端模拟，无真实后端） -->
  <section id="auth-register" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-logo">🌸</div>
      <h1 class="auth-title">消费记账</h1>
      <p class="auth-sub">注册一个账号，开始记账</p>

      <input id="reg-username" class="text-input" placeholder="用户名（3-20位字母/数字/下划线）" autocomplete="username" />
      <input id="reg-password" class="text-input" type="password" placeholder="密码（至少6位）" autocomplete="new-password" />
      <input id="reg-password2" class="text-input" type="password" placeholder="确认密码" autocomplete="new-password" />
      <button id="register-btn" class="btn-primary">注册</button>
      <div class="auth-switch">已有账号？<a id="to-login">去登录</a></div>
    </div>
  </section>

  <div class="app">

    <!-- 记一笔 -->
    <section id="view-home" class="view active">
      <header class="page-header">
        <h1>记一笔</h1>
      </header>

      <div class="type-toggle" role="tablist">
        <button id="type-expense" class="type-btn active" data-type="expense">支出</button>
        <button id="type-income" class="type-btn" data-type="income">收入</button>
      </div>

      <div class="amount-box">
        <span class="currency">¥</span>
        <input id="amount-input" inputmode="decimal" placeholder="0.00" autocomplete="off" />
      </div>
      <div class="quick-hint">支持「28 午餐」快捷输入，金额 + 备注一步搞定</div>

      <div id="category-grid" class="category-grid"></div>

      <div class="meta-row">
        <input id="note-input" placeholder="备注（可选，最多50字）" maxlength="50" autocomplete="off" />
        <input id="date-input" type="date" />
      </div>

      <button id="save-btn" class="btn-primary">保存</button>
    </section>

    <!-- 账单 -->
    <section id="view-bills" class="view">
      <header class="page-header bills-header">
        <button id="prev-month" class="month-nav" aria-label="上个月">‹</button>
        <div class="bills-title">
          <h1 id="bills-month-title">本月</h1>
          <div id="bills-summary" class="bills-summary"></div>
        </div>
        <button id="next-month" class="month-nav" aria-label="下个月">›</button>
      </header>
      <div id="bills-list" class="bills-list"></div>
    </section>

    <!-- 统计 -->
    <section id="view-stats" class="view">
      <header class="page-header"><h1>统计</h1></header>

      <div class="range-tabs" id="range-tabs">
        <button class="range-btn active" data-range="week">本周</button>
        <button class="range-btn" data-range="month">本月</button>
        <button class="range-btn" data-range="lastmonth">上月</button>
      </div>

      <div id="summary-cards" class="summary-cards"></div>

      <div class="card">
        <div class="card-title">支出分类占比</div>
        <div id="donut-chart" class="chart-box"></div>
        <div id="donut-legend" class="legend-table"></div>
      </div>

      <div class="card">
        <div class="card-title">收支趋势</div>
        <div id="line-chart" class="chart-box"></div>
        <div id="line-legend" class="line-legend"></div>
      </div>

      <div class="card">
        <div class="card-title">本月预算</div>
        <div id="budget-box" class="budget-box"></div>
      </div>
    </section>

    <!-- 我的 -->
    <section id="view-settings" class="view">
      <header class="page-header"><h1>我的</h1></header>

      <div class="card settings-group">
        <div class="settings-row">
          <div>
            <div class="settings-label">当前账号</div>
            <div class="settings-desc" id="user-desc">未登录</div>
          </div>
          <button id="logout-btn" class="btn-ghost">退出登录</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">使用场景</div>
            <div class="settings-desc" id="scene-desc"></div>
          </div>
          <button id="switch-scene-btn" class="btn-ghost">切换</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">月度预算</div>
            <div class="settings-desc" id="budget-desc">未设置</div>
          </div>
          <button id="set-budget-btn" class="btn-ghost">设置</button>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">数据导出</div>
            <div class="settings-desc">导出全部流水为 CSV</div>
          </div>
          <button id="export-btn" class="btn-ghost">导出</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">分类管理</div>
        <div id="category-manage" class="category-manage"></div>
        <button id="add-category-btn" class="btn-ghost add-cat">＋ 新增分类</button>
      </div>

      <div class="about">消费记账 · V1 演示版 · 登录为前端模拟，无真实后端</div>
    </section>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-view="home">
        <span class="tab-icon">✏️</span><span>记一笔</span>
      </button>
      <button class="tab" data-view="bills">
        <span class="tab-icon">📒</span><span>账单</span>
      </button>
      <button class="tab" data-view="stats">
        <span class="tab-icon">📊</span><span>统计</span>
      </button>
      <button class="tab" data-view="settings">
        <span class="tab-icon">👤</span><span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 首次使用：场景选择 -->
  <div id="onboarding" class="overlay hidden">
    <div class="modal onboarding-modal">
      <h2>欢迎使用消费记账 🎀</h2>
      <p class="onboarding-sub">选择你的使用场景，帮你准备好合适的分类</p>
      <button class="scene-card" data-scene="personal">
        <span class="scene-emoji">🏠</span>
        <span class="scene-name">个人 / 家庭</span>
        <span class="scene-desc">记录日常开销与收入</span>
      </button>
      <button class="scene-card" data-scene="business">
        <span class="scene-emoji">🏪</span>
        <span class="scene-name">经营 / 个体户</span>
        <span class="scene-desc">记清进账、开销与毛利</span>
      </button>
    </div>
  </div>

  <!-- 账单编辑 -->
  <div id="record-modal" class="overlay hidden">
    <div class="modal">
      <h2>编辑流水</h2>
      <div class="type-toggle modal-toggle">
        <button id="edit-type-expense" class="type-btn active">支出</button>
        <button id="edit-type-income" class="type-btn">收入</button>
      </div>
      <div class="amount-box small">
        <span class="currency">¥</span>
        <input id="edit-amount" inputmode="decimal" autocomplete="off" />
      </div>
      <div id="edit-category-grid" class="category-grid"></div>
      <div class="meta-row">
        <input id="edit-note" placeholder="备注（可选）" maxlength="50" autocomplete="off" />
        <input id="edit-date" type="date" />
      </div>
      <div class="modal-actions">
        <button id="edit-delete-btn" class="btn-danger">删除</button>
        <button id="edit-cancel-btn" class="btn-ghost">取消</button>
        <button id="edit-save-btn" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 分类编辑 -->
  <div id="category-modal" class="overlay hidden">
    <div class="modal">
      <h2 id="category-modal-title">新增分类</h2>
      <div class="type-toggle modal-toggle">
        <button id="cat-type-expense" class="type-btn active">支出</button>
        <button id="cat-type-income" class="type-btn">收入</button>
      </div>
      <input id="cat-name" class="text-input" placeholder="分类名称" maxlength="8" autocomplete="off" />
      <div class="picker-label">选择图标</div>
      <div id="cat-emoji-picker" class="emoji-picker"></div>
      <div class="picker-label">选择颜色</div>
      <div id="cat-color-picker" class="color-picker"></div>
      <div class="modal-actions">
        <button id="cat-cancel-btn" class="btn-ghost">取消</button>
        <button id="cat-save-btn" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 预算设置 -->
  <div id="budget-modal" class="overlay hidden">
    <div class="modal">
      <h2>设置月度预算</h2>
      <div class="amount-box small">
        <span class="currency">¥</span>
        <input id="budget-amount" inputmode="decimal" placeholder="0.00" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button id="budget-cancel-btn" class="btn-ghost">取消</button>
        <button id="budget-save-btn" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
